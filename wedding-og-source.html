<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<!-- 카카오톡 썸네일 원본 (1200x630). wedding-og.png / wedding-admin-og.png(?admin) 로 캡처해서 사용 -->
<!-- 두 썸네일은 같은 배경(연분홍·아이보리·복숭아빛, 꽃송이와 꽃잎), 글씨만 다름 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Noto+Serif+KR:wght@500;700&family=Gowun+Dodum&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; color: #6b3a4a; font-family: 'Noto Serif KR', serif;
    background:
      radial-gradient(circle at 18% 22%, rgba(255,214,224,.9) 0, rgba(255,214,224,0) 38%),
      radial-gradient(circle at 85% 80%, rgba(255,222,200,.9) 0, rgba(255,222,200,0) 40%),
      radial-gradient(circle at 80% 15%, rgba(232,222,255,.7) 0, rgba(232,222,255,0) 30%),
      linear-gradient(135deg, #fff6f8 0%, #fffaf3 50%, #fff3ee 100%); }
  svg.deco { position: absolute; inset: 0; }
  .card { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 660px; padding: 46px 40px 42px; text-align: center;
    background: rgba(255,255,255,.72); border-radius: 36px; box-shadow: 0 18px 50px rgba(214,120,150,.18); border: 2px solid rgba(255,255,255,.9); }
  .script { font-family: 'Great Vibes', cursive; font-size: 66px; line-height: 1; color: #e2738f; }
  h1 { font-size: 66px; font-weight: 700; letter-spacing: 2px; margin-top: 14px; color: #5e3343; }
  .sub { font-family: 'Gowun Dodum', sans-serif; font-size: 27px; color: #9a6b78; margin-top: 18px; }
  .pill { display: inline-block; margin-top: 22px; font-family: 'Gowun Dodum', sans-serif; font-size: 22px; font-weight: 700; color: #fff;
    background: linear-gradient(90deg, #f28aa5, #f5a87f); padding: 9px 26px; border-radius: 999px; box-shadow: 0 6px 16px rgba(242,138,165,.35); }
</style>
</head>
<body>
<svg class="deco" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- 다섯 장 꽃송이 -->
    <g id="flower">
      <g fill="currentColor">
        <ellipse cx="0" cy="-22" rx="15" ry="22"/>
        <ellipse cx="0" cy="-22" rx="15" ry="22" transform="rotate(72)"/>
        <ellipse cx="0" cy="-22" rx="15" ry="22" transform="rotate(144)"/>
        <ellipse cx="0" cy="-22" rx="15" ry="22" transform="rotate(216)"/>
        <ellipse cx="0" cy="-22" rx="15" ry="22" transform="rotate(288)"/>
      </g>
      <circle r="10" fill="#ffd36b"/>
      <circle r="5" fill="#f6b13c"/>
    </g>
    <g id="leaf"><path d="M0 0 C 14 -18, 40 -18, 54 0 C 40 18, 14 18, 0 0 Z" fill="#a9d4a5"/><path d="M4 0 L 50 0" stroke="#86bb82" stroke-width="2"/></g>
    <path id="petal" d="M0 -10 C 8 -10, 12 -2, 0 12 C -12 -2, -8 -10, 0 -10 Z"/>
    <path id="heart" d="M0 6 C -14 -4, -8 -16, 0 -8 C 8 -16, 14 -4, 0 6 Z"/>
    <g id="spark"><path d="M0 -10 L2.5 -2.5 L10 0 L2.5 2.5 L0 10 L-2.5 2.5 L-10 0 L-2.5 -2.5 Z" fill="#f2c45a"/></g>
  </defs>

  <!-- 왼쪽 위 꽃다발 -->
  <use href="#leaf" transform="translate(150 120) rotate(-30)"/>
  <use href="#leaf" transform="translate(80 170) rotate(200)"/>
  <use href="#leaf" transform="translate(200 40) rotate(20)"/>
  <use href="#flower" transform="translate(90 80) scale(1.5)" style="color:#f7a1b6"/>
  <use href="#flower" transform="translate(185 110) scale(1.05)" style="color:#ffc4a8"/>
  <use href="#flower" transform="translate(60 205) scale(.9)" style="color:#f9c7d4"/>
  <use href="#flower" transform="translate(250 50) scale(.75)" style="color:#e7c9f2"/>

  <!-- 오른쪽 아래 꽃다발 -->
  <use href="#leaf" transform="translate(1050 520) rotate(150)"/>
  <use href="#leaf" transform="translate(1120 460) rotate(-110)"/>
  <use href="#leaf" transform="translate(990 590) rotate(190)"/>
  <use href="#flower" transform="translate(1110 550) scale(1.55)" style="color:#f7a1b6"/>
  <use href="#flower" transform="translate(1010 520) scale(1.05)" style="color:#ffc4a8"/>
  <use href="#flower" transform="translate(1140 420) scale(.85)" style="color:#f9c7d4"/>
  <use href="#flower" transform="translate(945 595) scale(.7)" style="color:#e7c9f2"/>

  <!-- 흩날리는 꽃잎·하트·반짝이 -->
  <g fill="#f6a5b9" opacity=".85">
    <use href="#petal" transform="translate(330 130) rotate(25)"/>
    <use href="#petal" transform="translate(120 420) rotate(-40) scale(1.2)"/>
    <use href="#petal" transform="translate(880 90) rotate(60)"/>
    <use href="#petal" transform="translate(1060 230) rotate(-15) scale(1.1)"/>
    <use href="#petal" transform="translate(260 560) rotate(80)"/>
    <use href="#petal" transform="translate(760 590) rotate(-60) scale(.9)"/>
  </g>
  <g fill="#ffb990" opacity=".85">
    <use href="#petal" transform="translate(420 70) rotate(-30) scale(.9)"/>
    <use href="#petal" transform="translate(980 330) rotate(40)"/>
    <use href="#petal" transform="translate(60 330) rotate(10) scale(.8)"/>
    <use href="#petal" transform="translate(640 40) rotate(100) scale(.8)"/>
  </g>
  <g fill="#f28aa5" opacity=".8">
    <use href="#heart" transform="translate(1000 140) scale(1.4)"/>
    <use href="#heart" transform="translate(200 300) scale(1.1) rotate(-15)"/>
    <use href="#heart" transform="translate(860 560) scale(1.2) rotate(12)"/>
  </g>
  <use href="#spark" transform="translate(360 210) scale(1.2)"/>
  <use href="#spark" transform="translate(920 200) scale(1.5)"/>
  <use href="#spark" transform="translate(170 500) scale(1)"/>
  <use href="#spark" transform="translate(1100 300) scale(.9)"/>
  <use href="#spark" transform="translate(560 585) scale(1.1)"/>
  <g fill="#ffd36b" opacity=".7">
    <circle cx="300" cy="380" r="4"/><circle cx="1150" cy="150" r="5"/><circle cx="470" cy="30" r="3"/><circle cx="700" cy="610" r="4"/><circle cx="40" cy="560" r="5"/>
  </g>
</svg>

<div class="card">
  <div class="script">Wedding Day</div>
  <h1 id="title">결혼식 하객 접수</h1>
  <div class="sub" id="desc">청첩장 명단 · 방문 접수 · 축의금과 식권</div>
  <div class="pill" id="tag">함께 축하해 주셔서 감사합니다</div>
</div>
<script>
  if (location.search.indexOf('admin') >= 0) {
    document.getElementById('title').textContent = '하객 접수 관리자';
    document.getElementById('desc').textContent = '앱 설정 · 그룹 · 접수 담당자 · 자료 내보내기';
    document.getElementById('tag').textContent = '관리자 전용';
  }
</script>
</body>
</html>
